[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asr2s-grpc"
version = "0.1.0"
description = "Real-time ASR API for FireRedASR2S with gRPC streaming support"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [
    {name = "FireRedTeam"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "cn2an==0.5.23",
    "grpcio>=1.50.0",
    "grpcio-tools>=1.50.0",
    "kaldi_native_fbank==1.22.3",
    "kaldiio==2.18.0",
    "numpy>=1.26.0",
    "peft>=0.5.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sentencepiece==0.1.99",
    "soundfile==0.12.1",
    "textgrid",
    "torch>=2.0.0,<2.6.0",
    "torchaudio>=2.0.0,<2.6.0",
    "transformers==4.51.3",
    "setuptools<82",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "grpcio-tools>=1.50.0",
]

[project.scripts]
asr2s-grpc = "asr2s_grpc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.proto"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (require model weights)",
    "slow: marks tests as slow",
    "unit: marks tests as unit tests",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "asr2s_grpc.asr_pb2",
    "asr2s_grpc.asr_pb2_grpc",
]
ignore_errors = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
