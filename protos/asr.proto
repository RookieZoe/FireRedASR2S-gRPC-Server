syntax = "proto3";

package fireredasr2s;

option go_package = "github.com/fireredteam/fireredasr2s/api";

service ASRService {
  rpc StreamingRecognize(stream StreamingRecognizeRequest) returns (stream StreamingRecognizeResponse);
}

message StreamingRecognizeRequest {
  oneof request {
    RecognitionConfig config = 1;
    bytes audio_chunk = 2;
    bool end_stream = 3;
    AudioSlice audio_slice = 4;
  }
}

message AudioSlice {
  int32 index = 1;
  bytes data = 2;
}

message RecognitionConfig {
  int32 sample_rate = 1;
  string format = 2;
  bool enable_timestamps = 3;
  reserved 4;
  reserved "asr_type";
  int32 beam_size = 5;
  int32 slice_index = 6;
  // LLM-specific parameters
  int32 decode_min_len = 7;
  float repetition_penalty = 8;
  float llm_length_penalty = 9;
  float temperature = 10;
}

message StreamingRecognizeResponse {
  oneof response {
    PartialResult partial = 1;
    FinalResult final = 2;
    ErrorResult error = 3;
    SliceVad slice_vad = 4;
  }
}

message PartialResult {
  string segment_id = 1;
  int32 revision = 2;
  string text = 3;
  float confidence = 4;
  int32 start_ms = 5;
  int32 end_ms = 6;
  bool is_final = 7;
  int32 slice_index = 8;
  reserved 9;
  reserved "slice_m_ms";
}

message FinalResult {
  string segment_id = 1;
  string text = 2;
  repeated Sentence sentences = 3;
  repeated Word words = 4;
  int32 duration_ms = 5;
  string language = 6;
  float language_confidence = 7;
  int32 slice_index = 8;
  reserved 9;
  reserved "slice_m_ms";
}

message Sentence {
  string text = 1;
  int32 start_ms = 2;
  int32 end_ms = 3;
  float confidence = 4;
}

message Word {
  string text = 1;
  int32 start_ms = 2;
  int32 end_ms = 3;
  float confidence = 4;
}

message ErrorResult {
  string code = 1;
  string message = 2;
}

message SliceVad {
  int32 slice_index = 1;
  int32 slice_m_ms = 2;
  int32 slice_n_ms = 3;
  bool ended_speaking = 4;
  bool entirely_speech = 5;
}
